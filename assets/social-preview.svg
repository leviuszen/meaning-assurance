<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Meaning Assurance social preview</title>
  <desc id="desc">Your coding agent says done. Do you believe it? Agents propose. Evidence is verified. Humans decide. by LEVIUS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="1" stop-color="#17263c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1070" cy="100" r="210" fill="#55d6be" opacity="0.13" filter="url(#glow)"/>
  <circle cx="160" cy="610" r="260" fill="#f5b971" opacity="0.10" filter="url(#glow)"/>
  <rect x="72" y="70" width="1136" height="500" rx="28" fill="none" stroke="#8fa7bf" stroke-opacity="0.28"/>
  <text x="112" y="138" fill="#55d6be" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">MEANING ASSURANCE</text>
  <text x="112" y="255" fill="#f5f2e8" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Your coding agent says:</text>
  <text x="112" y="345" fill="#f5b971" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800">“Done.”</text>
  <text x="112" y="438" fill="#f5f2e8" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Do you believe it?</text>
  <line x1="112" y1="486" x2="1168" y2="486" stroke="#8fa7bf" stroke-opacity="0.32"/>
  <text x="112" y="530" fill="#b7c4d1" font-family="Segoe UI, Arial, sans-serif" font-size="25">Agents propose. Evidence is verified. Humans decide.</text>
  <text x="1090" y="530" fill="#b7c4d1" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="end">by LEVIUS</text>
</svg>
